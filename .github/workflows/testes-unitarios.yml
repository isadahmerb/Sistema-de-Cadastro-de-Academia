name: Testes unitários

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Rodar testes com cobertura
        run: dotnet test backend.Tests --collect:"XPlat Code Coverage" --settings backend.Tests/coverage.runsettings --results-directory ./TestResults

      - name: Resumo da cobertura
        if: always()
        run: |
          RATE=$(grep -o 'line-rate="[0-9.]*"' TestResults/*/coverage.cobertura.xml | head -1 | grep -o '[0-9.]*')
          echo "Cobertura de linhas: $(awk -v r="$RATE" 'BEGIN{printf "%.1f", r*100}')%" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: TestResults/**/coverage.cobertura.xml
